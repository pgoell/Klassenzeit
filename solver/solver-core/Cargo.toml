[package]
name         = "solver-core"
version      = "0.1.0"
publish      = false
edition.workspace      = true
rust-version.workspace = true

[lib]
# default rlib

[features]
default      = ["fixtures"]
# Enable diagnostic stderr trace lines from `try_place_block`. Off by default;
# the trace is a one-shot diagnostic for the FFD lock-in described in the
# active sprint of `docs/OPEN_THINGS.md`. Production callers
# (solver-py, the bench) never enable it.
solver-trace = []
# Expose hand-coded `Problem` fixtures via `pub mod test_fixtures`. Default-on
# because the criterion bench, integration tests, and the bake-off bench all
# consume them; solver-py opts out via `default-features = false` so the
# maturin-built wheel does not ship the fixture builders.
fixtures     = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest  = { workspace = true }

[[bench]]
name    = "solver_fixtures"
harness = false
