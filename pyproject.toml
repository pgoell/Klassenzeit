# Root pyproject.toml — declares the uv workspace and shared tool config.
# This is NOT a publishable package; it has no [project] section.

[tool.uv.workspace]
members = ["backend", "solver/solver-py"]

[tool.uv]
exclude-newer = "7 days"

[tool.uv.sources]
klassenzeit-solver = { workspace = true }

# ─── Shared Python tool config ──────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Use function-scoped event loops (pytest-asyncio default). The engine
# fixture is also function-scoped (see backend/tests/conftest.py), which
# keeps all asyncpg connections bound to the current test's event loop and
# avoids "Future attached to a different loop" errors.
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope   = "function"
testpaths    = ["backend/tests", "solver/solver-py/tests", "scripts/tests"]
# `importlib` avoids the classic pytest trap where two test dirs that both
# contain `__init__.py` collide under the same `tests` package name.
addopts      = ["--import-mode=importlib", "--cov-fail-under=80"]

[tool.ruff]
target-version = "py313"
line-length    = 100
extend-exclude = ["target", "backend/alembic/script.py.mako"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "C4",       # comprehensions
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "N",        # pep8-naming
    "PTH",      # pathlib over os.path
    "PIE",      # misc anti-patterns
    "RET",      # return statement hygiene
    "TID",      # tidy imports
    "TC",       # type-checking import grouping
    "S",        # bandit (security)
    "ASYNC",    # async best practices
    "ERA",      # eradicate commented-out code
    "PL",       # pylint subset
    "D",        # pydocstyle (docstring enforcement)
]
ignore = [
    "PLR0913",  # too many arguments — common in FastAPI handlers / DI
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "S101",     # assert is the point of a test
    "PLR2004",  # magic values are fine in test fixtures
    "D",        # docstrings not required in test files
]
"**/alembic/**" = [
    "D",        # docstrings not required in generated migration files
    "E501",     # long lines unavoidable in autogenerated constraint names
]

[tool.ruff.lint.isort]
known-first-party = ["klassenzeit_backend", "klassenzeit_solver"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version  = "3.14"
python-platform = "linux"
root            = ["."]

[tool.ty.src]
respect-ignore-files = true

[tool.vulture]
min_confidence = 80
paths          = ["backend/src"]

[tool.coverage.run]
source = ["backend/src", "solver/solver-py"]
omit = ["scripts/*"]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1",
    "markdown>=3.10.2",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.9",
    "ty>=0.0.28",
    "vulture>=2.16",
]
